[package]
name = "rdc-store"
description = "SQLite persistence for rd-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
data-encoding.workspace = true
getrandom.workspace = true
jiff = { workspace = true, features = ["std"] }
pbkdf2 = { workspace = true, features = ["hmac"] }
rdc-model.workspace = true
sha1.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite-bundled"] }
subtle.workspace = true
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["fs", "rt", "sync"] }
tracing.workspace = true
uuid = { workspace = true, features = ["std", "v4"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
