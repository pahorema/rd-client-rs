[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/pahorema/rd-client-rs"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
clap = { version = "4", default-features = false }
data-encoding = "2"
fancy-regex = "0.20"
fastrand = "2"
fs4 = "0.13"
getrandom = "0.4"
hmac = "0.13"
if-addrs = "0.15"
jiff = { version = "0.2", default-features = false }
mime_guess = "2"
pbkdf2 = { version = "0.13", default-features = false }
rdc-aria2 = { path = "crates/rdc-aria2" }
rdc-model = { path = "crates/rdc-model" }
rdc-synology = { path = "crates/rdc-synology" }
reqwest = { version = "0.13", default-features = false }
rust-embed = "8"
semver = "1"
serde = { version = "1", default-features = false }
serde_json = "1"
serde_repr = "0.1"
sha1 = "0.11"
sha2 = "0.11"
shell-words = "1"
sqlx = { version = "0.9", default-features = false }
subtle = { version = "2.6", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
unrar-ng = "0.7"
url = "2"
uuid = { version = "1", default-features = false }
wiremock = "0.6"
zip = { version = "9", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
unrar-ng = { path = "vendor/unrar-ng" }
