[package]
name = "rdc-engine"
description = "Torrent lifecycle and background jobs of rd-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
testing = ["dep:tempfile"]

[dependencies]
async-trait.workspace = true
data-encoding.workspace = true
fastrand.workspace = true
fs4.workspace = true
jiff = { workspace = true, features = ["std", "serde"] }
rdc-model.workspace = true
rdc-aria2.workspace = true
rdc-archive = { path = "../rdc-archive" }
rdc-debrid = { path = "../rdc-debrid" }
rdc-download = { path = "../rdc-download" }
rdc-store = { path = "../rdc-store" }
rdc-synology.workspace = true
rdc-torrent = { path = "../rdc-torrent" }
reqwest = { workspace = true, features = ["rustls", "json"] }
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shell-words.workspace = true
thiserror.workspace = true
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite-bundled"] }
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "registry"] }
wiremock.workspace = true
zip.workspace = true

[lints]
workspace = true
