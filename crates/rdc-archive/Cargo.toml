[package]
name = "rdc-archive"
description = "RAR and ZIP extraction and the post-download unpack procedure of rd-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-util.workspace = true
tracing = { workspace = true, features = ["std"] }
unrar-ng.workspace = true
uuid = { workspace = true, features = ["std", "v4"] }
zip = { workspace = true, features = ["deflate-flate2-zlib-rs", "deflate64"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
