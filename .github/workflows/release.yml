name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build (linux-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The image build already produces a static binary; reuse its stage and layer cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          outputs: type=local,dest=dist
      - run: tar -C dist -czf "rd-client-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz" rd-client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rd-client-linux-${{ matrix.arch }}
          path: rd-client-*.tar.gz

  native:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            runner: macos-latest
          - name: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - run: rustup toolchain install
      - run: cargo build --release --locked -p rdc-server
      - if: runner.os != 'Windows'
        run: tar -C target/release -czf "rd-client-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" rd-client
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/rd-client.exe -DestinationPath "rd-client-$env:GITHUB_REF_NAME-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rd-client-${{ matrix.name }}
          path: rd-client-*.*

  publish:
    name: Publish release
    needs: [linux, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rd-client-*
          merge-multiple: true
          path: dist
      - working-directory: dist
        run: sha256sum rd-client-* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
