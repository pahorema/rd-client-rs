[package]
name = "rdc-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rd-client"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "tokio", "query", "json", "form", "multipart"] }
clap = { workspace = true, features = ["derive", "env", "std", "help", "usage", "error-context"] }
data-encoding.workspace = true
fancy-regex.workspace = true
getrandom.workspace = true
hmac.workspace = true
jiff.workspace = true
mime_guess.workspace = true
rdc-debrid = { path = "../rdc-debrid" }
rdc-engine = { path = "../rdc-engine" }
rdc-model.workspace = true
rdc-store = { path = "../rdc-store" }
reqwest = { workspace = true, features = ["rustls"] }
rust-embed = { workspace = true, features = ["interpolate-folder-path"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "process", "sync"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tower-http = { workspace = true, features = ["catch-panic"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std"] }
url.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
rdc-engine = { path = "../rdc-engine", features = ["testing"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true

[lints]
workspace = true
