[package]
name = "rdc-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rd-client"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "tokio", "query", "json", "form", "multipart"] }
clap = { workspace = true, features = ["derive", "env", "std", "help", "usage", "error-context"] }
mime_guess.workspace = true
rdc-model.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
rust-embed = { workspace = true, features = ["interpolate-folder-path"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "process"] }
tower-http = { workspace = true, features = ["catch-panic"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std"] }
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
